<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ex-এর চক্করে | Real Snake Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700;800&family=Orbitron:wght@700;900&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0077;
            --neon-yellow: #ffe600;
            --snake-green: #22c55e;
            --bg-void: #06070c;
        }

        body {
            background-color: var(--bg-void);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(34, 197, 94, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 85% 80%, rgba(0, 243, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 15% 85%, rgba(255, 0, 119, 0.08) 0%, transparent 50%);
            font-family: 'Outfit', 'Hind Siliguri', sans-serif;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            touch-action: none;
        }

        .ambient-grid {
            position: fixed;
            inset: 0;
            background-size: 38px 38px;
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.025) 1px, transparent 1px);
            pointer-events: none;
            z-index: 0;
        }

        #gameApp {
            position: relative;
            width: 100%;
            max-width: 680px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            z-index: 2;
        }

        /* Top HUD */
        .top-hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(10, 15, 30, 0.85);
            border: 1.5px solid rgba(0, 243, 255, 0.35);
            border-radius: 30px;
            backdrop-filter: blur(14px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 243, 255, 0.15);
            margin-bottom: 6px;
            z-index: 10;
        }

        .hud-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Orbitron', 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .hud-score {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .hud-best {
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        .hud-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.05rem;
        }

        .hud-btn:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan);
            transform: scale(1.05);
        }

        /* Arena Container */
        #arenaContainer {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
            border-radius: 20px;
            overflow: hidden;
        }

        canvas {
            border: 2.5px solid rgba(34, 197, 94, 0.7);
            border-radius: 18px;
            box-shadow: 
                0 0 25px rgba(34, 197, 94, 0.35),
                0 0 60px rgba(0, 243, 255, 0.15),
                inset 0 0 25px rgba(34, 197, 94, 0.08);
            background: #04060a;
            display: block;
            touch-action: none;
        }

        /* Fullscreen Overlay Screens */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(10, 16, 30, 0.95) 0%, rgba(3, 5, 10, 0.98) 100%);
            backdrop-filter: blur(14px);
            border-radius: 18px;
            z-index: 30;
            padding: 24px;
            text-align: center;
            animation: popIn 0.25s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .tag-pill {
            display: inline-block;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #4ade80;
            font-size: 0.8rem;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .game-title {
            font-family: 'Hind Siliguri', 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #22c55e 0%, #00f3ff 50%, #ffe600 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(34, 197, 94, 0.65));
            animation: glowCycle 3s infinite alternate;
        }

        @keyframes glowCycle {
            0% { filter: drop-shadow(0 0 15px rgba(34, 197, 94, 0.6)) drop-shadow(0 0 30px rgba(0, 243, 255, 0.3)); }
            100% { filter: drop-shadow(0 0 25px rgba(0, 243, 255, 0.8)) drop-shadow(0 0 45px rgba(34, 197, 94, 0.5)); }
        }

        .game-sub {
            font-family: 'Hind Siliguri', sans-serif;
            color: #cbd5e1;
            font-size: 1.1rem;
            margin-bottom: 26px;
            font-weight: 600;
        }

        .neon-btn {
            position: relative;
            padding: 15px 48px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            background: linear-gradient(135deg, #22c55e, #00f3ff, #10b981);
            background-size: 200% 200%;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.5), 0 0 50px rgba(0, 243, 255, 0.35);
            transition: all 0.2s ease;
            overflow: hidden;
            animation: gradMove 4s ease infinite;
        }

        @keyframes gradMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .neon-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(34, 197, 94, 0.8), 0 0 70px rgba(0, 243, 255, 0.5);
        }

        .neon-btn:active {
            transform: scale(0.96);
        }

        .hint-bar {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            font-size: 0.85rem;
            color: #94a3b8;
            flex-wrap: wrap;
            justify-content: center;
            font-weight: 600;
        }

        .hint-item {
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Bottom Dedicated D-Pad */
        #controlsSection {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 0 2px 0;
            z-index: 10;
        }

        .dpad-container {
            display: grid;
            grid-template-columns: repeat(3, 62px);
            grid-template-rows: repeat(2, 50px);
            gap: 10px;
        }

        .dpad-key {
            background: rgba(14, 20, 36, 0.9);
            border: 1.5px solid rgba(34, 197, 94, 0.45);
            border-radius: 14px;
            color: #4ade80;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 12px rgba(34, 197, 94, 0.2);
            transition: all 0.1s ease;
            touch-action: manipulation;
        }

        .dpad-key:active, .dpad-key.active {
            background: rgba(34, 197, 94, 0.35);
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.8);
            transform: scale(0.92);
        }

        .key-up { grid-column: 2; grid-row: 1; }
        .key-left { grid-column: 1; grid-row: 2; }
        .key-down { grid-column: 2; grid-row: 2; }
        .key-right { grid-column: 3; grid-row: 2; }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .game-title { font-size: 2.2rem; }
            .neon-btn { padding: 13px 38px; font-size: 1.1rem; }
            .dpad-container {
                grid-template-columns: repeat(3, 58px);
                grid-template-rows: repeat(2, 48px);
                gap: 8px;
            }
            .dpad-key { font-size: 1.35rem; }
        }

        @media (min-width: 768px) {
            #gameApp {
                max-width: 750px;
            }
            .dpad-container {
                grid-template-columns: repeat(3, 68px);
                grid-template-rows: repeat(2, 52px);
            }
        }
    </style>
</head>
<body>
    <div class="ambient-grid"></div>

    <div id="gameApp">
        <!-- Top HUD -->
        <div class="top-hud">
            <div class="hud-stat">
                <span style="color: var(--neon-cyan);">⚡</span>
                <span>SCORE:</span>
                <span id="scoreVal" class="hud-score">0</span>
            </div>

            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="soundToggle" class="hud-btn" title="সাউন্ড চালু/বন্ধ">🔊</button>
                <div class="hud-stat">
                    <span>🏆</span>
                    <span>BEST:</span>
                    <span id="bestVal" class="hud-best">0</span>
                </div>
            </div>
        </div>

        <!-- Arena Canvas -->
        <div id="arenaContainer">
            <canvas id="gameCanvas"></canvas>

            <!-- Start Screen Overlay -->
            <div id="startScreen" class="overlay">
                <div class="tag-pill">REALISTIC VIPER EDITION</div>
                <h1 class="game-title">Ex-এর চক্করে</h1>
                <p class="game-sub">বাস্তব সাপের সাথে সব মায়া ও ফাঁদ এড়িয়ে এগিয়ে যান 🐍</p>
                <button id="startBtn" class="neon-btn">START GAME</button>
                <div class="hint-bar">
                    <div class="hint-item">📱 মোবাইল: নিচের বাটন অথবা স্ক্রিনে সোয়াইপ</div>
                    <div class="hint-item">💻 কম্পিউটার: Arrow Keys / WASD</div>
                </div>
            </div>

            <!-- Game Over Screen Overlay -->
            <div id="gameOverScreen" class="overlay hidden">
                <div class="tag-pill" style="background: rgba(255, 0, 85, 0.2); border-color: #ff0055; color: #ff0077;">GAME OVER</div>
                <h1 class="game-title" style="background: linear-gradient(135deg, #ff0055, #ffaa00); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Ex-এর জয়! 💀</h1>
                <p class="game-sub">আপনি আবার মায়ায় আটকে গেলেন!</p>

                <div style="display: flex; gap: 18px; margin: 12px 0 24px 0;">
                    <div class="hud-stat" style="background: rgba(255, 255, 255, 0.08); padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(0, 243, 255, 0.4);">
                        <span>SCORE:</span>
                        <span id="finalScore" class="hud-score" style="font-size: 1.3rem;">0</span>
                    </div>
                    <div class="hud-stat" style="background: rgba(255, 255, 255, 0.08); padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(255, 230, 0, 0.4);">
                        <span>BEST:</span>
                        <span id="finalBest" class="hud-best" style="font-size: 1.3rem;">0</span>
                    </div>
                </div>

                <button id="restartBtn" class="neon-btn">PLAY AGAIN</button>
            </div>
        </div>

        <!-- Dedicated Bottom D-Pad -->
        <div id="controlsSection">
            <div class="dpad-container">
                <button class="dpad-key key-up" id="btnUp" aria-label="Up">▲</button>
                <button class="dpad-key key-left" id="btnLeft" aria-label="Left">◀</button>
                <button class="dpad-key key-down" id="btnDown" aria-label="Down">▼</button>
                <button class="dpad-key key-right" id="btnRight" aria-label="Right">▶</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const arenaContainer = document.getElementById('arenaContainer');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreVal = document.getElementById('scoreVal');
        const bestVal = document.getElementById('bestVal');
        const finalScore = document.getElementById('finalScore');
        const finalBest = document.getElementById('finalBest');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const soundToggle = document.getElementById('soundToggle');

        // Bengali Toxic Themes
        const themes = [
            "সময় নষ্ট", "টাকা নষ্ট", "মানসিক শান্তি নষ্ট", "মাথা খারাপ", "ফোকাস নষ্ট",
            "বিশ্বাস নষ্ট", "আবেগ নিয়ে খেলা", "ঘুম নষ্ট", "পড়াশোনা নষ্ট", "ক্যারিয়ার ক্ষতি",
            "ভবিষ্যৎ নষ্ট", "আত্মসম্মান নষ্ট", "মোটিভেশন শেষ", "বন্ধু দূরে", "মানসিক চাপ",
            "জীবন এলোমেলো", "আশা নষ্ট", "শক্তি নষ্ট"
        ];

        let gameRunning = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('ex_chokkore_best') || '0', 10);
        let cellSize = 24;
        let cols = 20;
        let rows = 20;
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = [];
        let particles = [];
        let soundEnabled = true;
        let gameSpeed = 105;
        let lastTime = 0;
        let accumulator = 0;

        bestVal.textContent = highScore;

        // Audio System
        let audioContext = null;
        function getAudioContext() {
            if (!audioContext) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) audioContext = new AudioCtx();
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            return audioContext;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const actx = getAudioContext();
                if (!actx) return;

                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.connect(gain);
                gain.connect(actx.destination);

                if (type === 'eat') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(540, actx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(920, actx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.2, actx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.12);
                    osc.start(actx.currentTime);
                    osc.stop(actx.currentTime + 0.12);
                } else if (type === 'turn') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(260, actx.currentTime);
                    gain.gain.setValueAtTime(0.04, actx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.04);
                    osc.start(actx.currentTime);
                    osc.stop(actx.currentTime + 0.04);
                } else if (type === 'die') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, actx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(60, actx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.3, actx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.5);
                    osc.start(actx.currentTime);
                    osc.stop(actx.currentTime + 0.5);
                }
            } catch (e) {}
        }

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
            soundToggle.style.opacity = soundEnabled ? '1' : '0.5';
        });

        function triggerHaptic(duration = 20) {
            if (navigator.vibrate) {
                try { navigator.vibrate(duration); } catch (e) {}
            }
        }

        // Particle Burst System
        function spawnParticles(x, y, color) {
            for (let i = 0; i < 18; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.5 + Math.random() * 3.5;
                particles.push({
                    x: x * cellSize + cellSize / 2,
                    y: y * cellSize + cellSize / 2,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    size: 2.5 + Math.random() * 3,
                    alpha: 1,
                    decay: 0.025 + Math.random() * 0.03
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Responsive Canvas
        function resizeCanvas() {
            const width = arenaContainer.clientWidth;
            const height = arenaContainer.clientHeight;

            cellSize = Math.max(20, Math.min(28, Math.floor(Math.min(width, height) / 18)));
            cols = Math.floor(width / cellSize);
            rows = Math.floor(height / cellSize);

            canvas.width = cols * cellSize;
            canvas.height = rows * cellSize;
        }

        function initGame() {
            resizeCanvas();
            const startX = Math.floor(cols / 2);
            const startY = Math.floor(rows / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY },
                { x: startX - 3, y: startY }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            particles = [];
            scoreVal.textContent = '0';
            generateFood();
            gameRunning = true;
        }

        function generateFood() {
            food = [];
            const count = Math.min(4, Math.max(3, Math.floor((cols * rows) / 95)));
            const usedThemes = new Set();

            for (let i = 0; i < count; i++) {
                let theme;
                let attempts = 0;
                do {
                    theme = themes[Math.floor(Math.random() * themes.length)];
                    attempts++;
                } while (usedThemes.has(theme) && attempts < 25);
                usedThemes.add(theme);

                // Vibrant high-visibility colors
                const palette = ['#ff0055', '#00f3ff', '#ffe600', '#ff8800', '#a855f7'];
                const color = palette[i % palette.length];

                for (let retry = 0; retry < 60; retry++) {
                    // Keep away from the very edge so badges never get cut off
                    const candidate = {
                        x: Math.floor(Math.random() * (cols - 4)) + 2,
                        y: Math.floor(Math.random() * (rows - 4)) + 2,
                        color: color,
                        name: theme
                    };
                    const conflict = snake.some(s => s.x === candidate.x && s.y === candidate.y) ||
                                     food.some(f => f.x === candidate.x && f.y === candidate.y);
                    if (!conflict) {
                        food.push(candidate);
                        break;
                    }
                }
            }
        }

        // ============================================
        // REALISTIC SNAKE RENDERING WITH "EX" ON HEAD
        // ============================================
        function drawRealisticSnake() {
            if (snake.length === 0) return;

            // 1. Soft 3D drop shadow underneath snake
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            for (let i = snake.length - 1; i >= 0; i--) {
                const seg = snake[i];
                const px = seg.x * cellSize + cellSize / 2;
                const py = seg.y * cellSize + cellSize / 2 + 4;
                const r = (cellSize / 2) * (1 - (i / snake.length) * 0.45);
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // 2. Realistic Body Segments with Scales & Tapering Tail
            for (let i = snake.length - 1; i > 0; i--) {
                const seg = snake[i];
                const prev = snake[i - 1];
                const px = seg.x * cellSize + cellSize / 2;
                const py = seg.y * cellSize + cellSize / 2;
                const prevX = prev.x * cellSize + cellSize / 2;
                const prevY = prev.y * cellSize + cellSize / 2;

                const isWrapped = Math.abs(seg.x - prev.x) > 1 || Math.abs(seg.y - prev.y) > 1;
                const t = i / snake.length; // 0 at head, 1 at tail
                const radius = (cellSize / 2) * (1.1 - t * 0.45);

                ctx.save();
                // 1. Draw segment scale circle
                const segGrad = ctx.createRadialGradient(px, py, radius * 0.2, px, py, radius);
                if (i % 2 === 0) {
                    segGrad.addColorStop(0, '#4ade80');
                    segGrad.addColorStop(0.6, '#22c55e');
                    segGrad.addColorStop(1, '#15803d');
                } else {
                    segGrad.addColorStop(0, '#22c55e');
                    segGrad.addColorStop(0.6, '#16a34a');
                    segGrad.addColorStop(1, '#0e6934');
                }
                ctx.fillStyle = segGrad;
                ctx.beginPath();
                ctx.arc(px, py, radius, 0, Math.PI * 2);
                ctx.fill();

                // 2. Connect with previous segment if adjacent
                if (!isWrapped) {
                    ctx.beginPath();
                    ctx.lineWidth = radius * 2;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.strokeStyle = segGrad;
                    ctx.moveTo(px, py);
                    ctx.lineTo(prevX, prevY);
                    ctx.stroke();
                }

                // Diamond Viper Back Markings
                if (i % 2 === 1 && radius > 5) {
                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.ellipse(px, py, radius * 0.38, radius * 0.52, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#052e16';
                    ctx.beginPath();
                    ctx.arc(px, py, radius * 0.22, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // 3. Realistic Snake Head (snake[0])
            const head = snake[0];
            const hx = head.x * cellSize + cellSize / 2;
            const hy = head.y * cellSize + cellSize / 2;

            let angle = 0;
            if (direction.x === 1) angle = 0;
            else if (direction.x === -1) angle = Math.PI;
            else if (direction.y === 1) angle = Math.PI / 2;
            else if (direction.y === -1) angle = -Math.PI / 2;

            ctx.save();
            ctx.translate(hx, hy);
            ctx.rotate(angle);

            const hr = cellSize * 0.72; // Realistic head dimension

            // Animated Red Forked Tongue
            const tonguePhase = Math.sin(Date.now() / 110);
            if (tonguePhase > 0.1) {
                const tongueLen = hr * (0.85 + tonguePhase * 0.55);
                ctx.save();
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(hr * 0.85, 0);
                ctx.lineTo(hr * 0.85 + tongueLen * 0.7, 0);
                // Forks
                ctx.lineTo(hr * 0.85 + tongueLen, -tongueLen * 0.28);
                ctx.moveTo(hr * 0.85 + tongueLen * 0.7, 0);
                ctx.lineTo(hr * 0.85 + tongueLen, tongueLen * 0.28);
                ctx.stroke();
                ctx.restore();
            }

            // Realistic Triangular Viper Head Contour
            ctx.beginPath();
            ctx.moveTo(hr * 0.95, 0); // Snout tip
            // Top jaw / cheek flare
            ctx.bezierCurveTo(hr * 0.65, -hr * 0.55, -hr * 0.15, -hr * 0.8, -hr * 0.65, -hr * 0.48);
            // Neck connection
            ctx.bezierCurveTo(-hr * 0.85, -hr * 0.2, -hr * 0.85, hr * 0.2, -hr * 0.65, hr * 0.48);
            // Bottom jaw / cheek flare
            ctx.bezierCurveTo(-hr * 0.15, hr * 0.8, hr * 0.65, hr * 0.55, hr * 0.95, 0);
            ctx.closePath();

            // Head scale shading
            const headGrad = ctx.createRadialGradient(0, 0, hr * 0.2, 0, 0, hr);
            headGrad.addColorStop(0, '#4ade80');
            headGrad.addColorStop(0.5, '#22c55e');
            headGrad.addColorStop(1, '#052e16');
            ctx.fillStyle = headGrad;
            ctx.fill();

            ctx.strokeStyle = '#86efac';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Nostrils
            ctx.fillStyle = '#052e16';
            ctx.beginPath();
            ctx.arc(hr * 0.78, -hr * 0.16, 1.4, 0, Math.PI * 2);
            ctx.arc(hr * 0.78, hr * 0.16, 1.4, 0, Math.PI * 2);
            ctx.fill();

            // Venomous Golden Viper Eyes with Slit Pupil
            const eyeX = hr * 0.28;
            const eyeY = hr * 0.48;

            function drawEye(ey) {
                ctx.save();
                // Eye contour shadow
                ctx.fillStyle = '#022c22';
                ctx.beginPath();
                ctx.ellipse(eyeX, ey, hr * 0.26, hr * 0.19, 0, 0, Math.PI * 2);
                ctx.fill();

                // Amber / Gold Iris
                const iris = ctx.createRadialGradient(eyeX, ey, 1, eyeX, ey, hr * 0.22);
                iris.addColorStop(0, '#fef08a');
                iris.addColorStop(0.65, '#eab308');
                iris.addColorStop(1, '#9a3412');
                ctx.fillStyle = iris;
                ctx.beginPath();
                ctx.ellipse(eyeX, ey, hr * 0.23, hr * 0.16, 0, 0, Math.PI * 2);
                ctx.fill();

                // Vertical Slit Pupil
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.ellipse(eyeX, ey, hr * 0.06, hr * 0.15, 0, 0, Math.PI * 2);
                ctx.fill();

                // Specular Light Dot
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(eyeX - 1.2, ey - 1.2, 1.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawEye(-eyeY);
            drawEye(eyeY);

            // ============================================
            // HIGH-CONTRAST "EX" EMBLEM ON THE HEAD
            // ============================================
            ctx.save();
            const badgeW = hr * 0.85;
            const badgeH = hr * 0.7;
            const badgeX = -hr * 0.42;
            const badgeY = -badgeH / 2;

            // Plate Backdrop with Neon Border
            ctx.fillStyle = '#060a14';
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#00f3ff';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 5);
            ctx.fill();
            ctx.stroke();

            // Crisp Glowing "EX" Text
            ctx.fillStyle = '#ffffff';
            ctx.font = `900 ${Math.floor(hr * 0.56)}px 'Orbitron', 'Outfit', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#00f3ff';
            ctx.shadowBlur = 10;
            ctx.fillText('EX', badgeX + badgeW / 2, 0);
            ctx.restore();

            ctx.restore();
        }

        // ============================================
        // FOOD RENDERING WITH ULTRA-VISIBLE TEXT BADGES
        // ============================================
        function drawFood() {
            const time = Date.now();
            const pulse = Math.sin(time / 160) * 2;

            food.forEach(item => {
                const px = item.x * cellSize + cellSize / 2;
                const py = item.y * cellSize + cellSize / 2;
                const radius = Math.max(5, cellSize / 2 - 3 + pulse);

                ctx.save();
                ctx.shadowColor = item.color;
                ctx.shadowBlur = 20;

                // Glowing 3D Orb
                const grad = ctx.createRadialGradient(px, py, 1, px, py, radius);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, item.color);
                grad.addColorStop(1, 'rgba(0,0,0,0.9)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(px, py, radius, 0, Math.PI * 2);
                ctx.fill();

                // Inner bright pulse core
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(px - radius * 0.25, py - radius * 0.25, radius * 0.25, 0, Math.PI * 2);
                ctx.fill();

                // ============================================
                // ULTRA-VISIBLE HIGH CONTRAST BENGALI BADGE
                // ============================================
                const fontSize = Math.max(13, Math.floor(cellSize * 0.65));
                ctx.font = `800 ${fontSize}px 'Hind Siliguri', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const textY = item.y <= 1 ? py + radius + 16 : py - radius - 16;
                const metrics = ctx.measureText(item.name);
                const textWidth = metrics.width;
                const padX = 10;
                const padY = 5;
                const boxW = textWidth + padX * 2;
                const boxH = fontSize + padY * 2;
                const boxX = px - boxW / 2;
                const boxY = textY - boxH / 2;

                // 1. Solid High-Contrast Dark Badge Background
                ctx.save();
                ctx.fillStyle = 'rgba(6, 8, 16, 0.96)';
                ctx.strokeStyle = item.color;
                ctx.lineWidth = 2.2;
                ctx.shadowColor = item.color;
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.roundRect(boxX, boxY, boxW, boxH, 8);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                // 2. Black outline around text for guaranteed 100% legibility
                ctx.save();
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = '#000000';
                ctx.strokeText(item.name, px, textY);

                // 3. Crisp Bold White Text
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = item.color;
                ctx.shadowBlur = 8;
                ctx.fillText(item.name, px, textY);
                ctx.restore();

                ctx.restore();
            });
        }

        function updateSnake() {
            direction = { ...nextDirection };
            const head = { ...snake[0] };
            head.x += direction.x;
            head.y += direction.y;

            // Screen Wrap
            if (head.x < 0) head.x = cols - 1;
            if (head.x >= cols) head.x = 0;
            if (head.y < 0) head.y = rows - 1;
            if (head.y >= rows) head.y = 0;

            // Self-Collision Check
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Food Eat Collision
            const eatenIndex = food.findIndex(item => item.x === head.x && item.y === head.y);
            if (eatenIndex !== -1) {
                const eaten = food.splice(eatenIndex, 1)[0];
                score += 10;
                scoreVal.textContent = score;

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('ex_chokkore_best', highScore);
                    bestVal.textContent = highScore;
                }

                playSound('eat');
                triggerHaptic(30);
                spawnParticles(eaten.x, eaten.y, eaten.color);

                // Spawn Replacement Food
                const theme = themes[Math.floor(Math.random() * themes.length)];
                const palette = ['#ff0055', '#00f3ff', '#ffe600', '#ff8800', '#a855f7'];
                const color = palette[Math.floor(Math.random() * palette.length)];

                for (let retry = 0; retry < 60; retry++) {
                    const candidate = {
                        x: Math.floor(Math.random() * (cols - 4)) + 2,
                        y: Math.floor(Math.random() * (rows - 4)) + 2,
                        color: color,
                        name: theme
                    };
                    const conflict = snake.some(s => s.x === candidate.x && s.y === candidate.y) ||
                                     food.some(f => f.x === candidate.x && f.y === candidate.y);
                    if (!conflict) {
                        food.push(candidate);
                        break;
                    }
                }
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameRunning = false;
            playSound('die');
            triggerHaptic(100);

            finalScore.textContent = score;
            finalBest.textContent = highScore;
            gameOverScreen.classList.remove('hidden');
        }

        function gameLoop(currentTime) {
            if (!gameRunning) return;
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            accumulator += deltaTime;

            while (accumulator >= gameSpeed) {
                updateSnake();
                accumulator -= gameSpeed;
            }

            // Clear Background
            ctx.fillStyle = '#04060a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle Cyber Grid
            ctx.strokeStyle = 'rgba(34, 197, 94, 0.04)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += cellSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += cellSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            drawFood();
            drawRealisticSnake();
            updateAndDrawParticles();
            requestAnimationFrame(gameLoop);
        }

        function changeDirection(newX, newY) {
            if (!gameRunning) return;
            if (newX !== 0 && direction.x === 0) {
                nextDirection = { x: newX, y: 0 };
                playSound('turn');
                triggerHaptic(12);
            } else if (newY !== 0 && direction.y === 0) {
                nextDirection = { x: 0, y: newY };
                playSound('turn');
                triggerHaptic(12);
            }
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowup' || key === 'w') {
                changeDirection(0, -1);
                e.preventDefault();
            } else if (key === 'arrowdown' || key === 's') {
                changeDirection(0, 1);
                e.preventDefault();
            } else if (key === 'arrowleft' || key === 'a') {
                changeDirection(-1, 0);
                e.preventDefault();
            } else if (key === 'arrowright' || key === 'd') {
                changeDirection(1, 0);
                e.preventDefault();
            }
        });

        // Touch & Swipe Controls
        let touchStartX = 0;
        let touchStartY = 0;
        const SWIPE_DIST = 22;

        canvas.addEventListener('touchstart', (e) => {
            getAudioContext();
            if (e.touches.length > 0) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (!gameRunning) return;
            e.preventDefault();
            if (e.touches.length === 0) return;

            const curX = e.touches[0].clientX;
            const curY = e.touches[0].clientY;
            const dx = curX - touchStartX;
            const dy = curY - touchStartY;

            if (Math.abs(dx) > SWIPE_DIST || Math.abs(dy) > SWIPE_DIST) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0) changeDirection(1, 0);
                    else changeDirection(-1, 0);
                } else {
                    if (dy > 0) changeDirection(0, 1);
                    else changeDirection(0, -1);
                }
                touchStartX = curX;
                touchStartY = curY;
            }
        }, { passive: false });

        // D-Pad Button Setup
        function setupDpadKey(id, dx, dy) {
            const btn = document.getElementById(id);
            const press = (e) => {
                e.preventDefault();
                getAudioContext();
                changeDirection(dx, dy);
                btn.classList.add('active');
            };
            const release = () => btn.classList.remove('active');

            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        }

        setupDpadKey('btnUp', 0, -1);
        setupDpadKey('btnDown', 0, 1);
        setupDpadKey('btnLeft', -1, 0);
        setupDpadKey('btnRight', 1, 0);

        function startGame() {
            getAudioContext();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            initGame();
            lastTime = performance.now();
            accumulator = 0;
            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        window.addEventListener('resize', () => {
            if (!gameRunning) resizeCanvas();
        });

        resizeCanvas();
    </script>
</body>
</html>
